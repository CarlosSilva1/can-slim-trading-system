name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: market-data-research-v2

    - name: Run 10-year QQQ comparison
      working-directory: python-engine
      run: |
        python3 - <<'PY'
        import urllib.request, runpy
        opener = urllib.request.build_opener()
        opener.addheaders = [('User-Agent', 'Mozilla/5.0 research')]
        urllib.request.install_opener(opener)
        runpy.run_path('qqq_10yr_baseline_vs_ema21.py', run_name='__main__')
        PY
