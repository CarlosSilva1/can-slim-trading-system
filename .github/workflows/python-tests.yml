name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: market-data-research-v2

    - name: Run 10-year QQQ comparison
      working-directory: python-engine
      run: python3 qqq_10yr_baseline_vs_ema21.py
