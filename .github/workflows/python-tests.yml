name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      working-directory: python-engine
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run QQQ trailing comparison only
      working-directory: python-engine
      run: |
        pytest tests/test_qqq_trailing_comparison.py -v || true
